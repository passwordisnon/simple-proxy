<!doctype html><html><head><meta charset="utf8"><title>gallery</title>
<style>body{margin:0;background:#f4ecff;font:12px sans-serif}#out{display:grid;grid-template-columns:repeat(var(--cols),var(--px));gap:6px;padding:6px}figure{margin:0;background:linear-gradient(#e8f6ff,#fff3e2);border-radius:10px;text-align:center}figure img{width:var(--px);height:var(--px);display:block}figcaption{padding:2px 4px 5px;font-weight:bold;color:#3b3450;font-size:11px}</style>
</head><body><div id="out"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/ex/RoundedBoxGeometry.js"></script>
<script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script>
<script>
/* gallery.html?src=js/furniture.js&reg=FURN[&from=0&n=24][&ids=a,b][&opt={json}][&cols=6&show=220&px=440][&angle=front|top|side]
   reg = JS-Ausdruck, der ein Array von {id,n,b(g,m,opt,rnd)} oder ein Objekt {id:{b,...}} liefert. */
const qs=new URLSearchParams(location.search);
const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));const _w=console.warn;console.warn=(...a)=>{errors.push(a.map(String).join(' '));_w(...a)};
const srcs=(qs.get('src')||'').split(',').filter(Boolean);
let k=0;function next(){if(k<srcs.length){const s=document.createElement('script');s.src='../'+srcs[k++];s.onload=next;s.onerror=()=>{errors.push('load fail '+s.src);next()};document.body.append(s)}else run()}next();
function run(){
 const W=+(qs.get('px')||440);const c=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,W,false);r.outputEncoding=THREE.sRGBEncoding;
 const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,1,.01,500);
 document.documentElement.style.setProperty('--cols',qs.get('cols')||'6');document.documentElement.style.setProperty('--px',(qs.get('show')||220)+'px');
 let reg;try{reg=eval(qs.get('reg'))}catch(e){errors.push('reg '+e.message);reg=[]}
 let list=Array.isArray(reg)?reg:Object.entries(reg).map(([id,v])=>Object.assign({id},v));
 if(qs.get('ids')){const want=qs.get('ids').split(',');list=list.filter(x=>want.includes(x.id))}
 const from=+(qs.get('from')||0),nn=+(qs.get('n')||999);const total=list.length;list=list.slice(from,from+nn);
 const opt=qs.get('opt')?JSON.parse(qs.get('opt')):undefined;const M=makeMats({skin:'haut',color:0});
 const ang=qs.get('angle')||'front';const dir=ang==='top'?new V3(.3,1.4,.6).normalize():ang==='side'?new V3(1,.25,.15).normalize():new V3(.6,.45,1).normalize();
 const out=document.getElementById('out');
 for(const it of list){let url='';try{const g=new THREE.Group();QF=1;it.b(g,M,opt||it.opt,srand(7));if(qs.get('outline')!=='0')addOutlines(g);sc.add(g);g.updateMatrixWorld(true);
   const box=new THREE.Box3().setFromObject(g);const ctr=box.getCenter(new V3()),sz=box.getSize(new V3());const rad=Math.max(sz.x,sz.y,sz.z)*.62+.02;
   cam.position.copy(ctr).addScaledVector(dir,rad/Math.tan(15*PI/180));cam.lookAt(ctr);cam.near=rad*.05;cam.far=rad*40;cam.updateProjectionMatrix();r.render(sc,cam);url=c.toDataURL('image/png');sc.remove(g);disposeTree(g)}catch(e){errors.push(it.id+': '+e.message)}
  const f=document.createElement('figure');const im=new Image();im.src=url;const cap=document.createElement('figcaption');cap.textContent=it.id+(it.n?' · '+it.n:'');f.append(im,cap);out.append(f)}
 window.__done={errors,count:list.length,total};
}
</script></body></html>
