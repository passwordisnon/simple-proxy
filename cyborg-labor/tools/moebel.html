<!doctype html><html><head><meta charset="utf8"><title>moebel</title>
<style>body{margin:0;background:#f4ecff;font:11px sans-serif}#out{display:grid;grid-template-columns:repeat(6,200px);gap:4px;padding:4px}figure{margin:0;background:linear-gradient(#cfeaff,#fff3e2);border-radius:8px;text-align:center}figure img{width:200px;height:170px;display:block}figcaption{padding:2px}</style>
</head><body><div id="out"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/ex/RoundedBoxGeometry.js"></script>
<script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script>
<script src="../js/furniture.js"></script>
<script src="../js/moebel2.js"></script>
<script>
/* Kontaktbogen für Möbel: ?pre=m2_ (Id-Präfix) &pl=planet &from=0 &n=36 */
(()=>{const qs=new URLSearchParams(location.search);const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));
const c=document.createElement('canvas');c.width=400;c.height=340;const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(400,340,false);r.outputEncoding=THREE.sRGBEncoding;
const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,400/340,.01,100);
const pre=qs.get('pre')||'m2_',pl=qs.get('pl');const ids=qs.get('ids');let list=FURN.filter(f=>(ids?ids.split(',').includes(f.id):f.id.startsWith(pre))&&(!pl||f.planet===pl));const total=list.length;const from=+(qs.get('from')||0);list=list.slice(from,from+ +(qs.get('n')||36));
const M=makeMats({skin:'haut',color:0});let cnt=0;
for(const f of list){let url='';try{const g=new THREE.Group();f.b(g,M,{},srand(1));if(g.userData.light){const L=g.userData.light;const pl=new THREE.PointLight(L.c,L.i*1.3,9,1.6);pl.position.set(...L.p);g.add(pl)}sc.add(g);
  const box=new THREE.Box3().setFromObject(g);const ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());const rad=Math.max(sz.x,sz.y,sz.z)*.62+.05;
  const dir=new THREE.Vector3(.7,.5,1).normalize();cam.position.copy(ctr).addScaledVector(dir,rad/Math.tan(15*Math.PI/180));cam.lookAt(ctr);cam.updateProjectionMatrix();r.render(sc,cam);url=c.toDataURL('image/png');sc.remove(g);cnt++}catch(e){errors.push(f.id+': '+e.message)}
  const fg=document.createElement('figure');const im=new Image();im.src=url;fg.append(im);const cp=document.createElement('figcaption');cp.textContent=f.n+' ('+f.planet+')';fg.append(cp);document.getElementById('out').append(fg)}
window.__done={errors,count:cnt,total}})();
</script></body></html>
