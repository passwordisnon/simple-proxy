<!doctype html><html><head><meta charset="utf8"><title>bau</title>
<style>body{margin:0;background:#f4ecff;font:11px sans-serif}#out{display:grid;grid-template-columns:repeat(6,220px);gap:4px;padding:4px}figure{margin:0;background:linear-gradient(#e8f6ff,#fff3e2);border-radius:8px;text-align:center}figure img{width:220px;height:200px;display:block}figcaption{padding:2px}</style>
</head><body><div id="out"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/ex/RoundedBoxGeometry.js"></script>
<script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script>
<script src="../js/kit.js"></script>
<script src="../js/data.js"></script>
<script src="../js/nature.js"></script>
<script src="../js/fundus-data.js"></script>
<script src="../js/kitbau.js"></script>
<script>
/* bau.html?r=wuerfelhaus,burgturm&v=0,1,2  – Bauwerke aus kitbau.js rendern */
(async()=>{const qs=new URLSearchParams(location.search);const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));
const _f=window.fetch;window.fetch=(u,o)=>_f('../'+u,o);
const ids=(qs.get('r')||KITBAU.RECIPES.map(r=>r.id).join(',')).split(',');const vs=qs.get('v')?qs.get('v').split(',').map(Number):null;
const W=440;const c=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,W*200/220,false);r.outputEncoding=THREE.sRGBEncoding;
const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,220/200,.01,500);
for(const id of ids){const R=KITBAU.RECIPES.find(x=>x.id===id);if(!R){errors.push('kein Rezept '+id);continue}await KIT.loadExt(R.kit);
  for(const v of(vs||[...Array(Math.min(R.n,6)).keys()])){if(v>=R.n)continue;let url='';try{const g=KITBAU.build(R,v);sc.add(g);g.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(g);const ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());const rad=Math.max(sz.x,sz.y,sz.z)*.62+.05;
    const dir=new THREE.Vector3(.8,.6,1).normalize();cam.position.copy(ctr).addScaledVector(dir,rad/Math.tan(15*Math.PI/180));cam.lookAt(ctr);cam.near=rad*.02;cam.far=rad*40;cam.updateProjectionMatrix();r.render(sc,cam);url=c.toDataURL('image/png');sc.remove(g)}catch(e){errors.push(id+'/'+v+': '+e.message)}
    const f=document.createElement('figure');const im=new Image();im.src=url;const cap=document.createElement('figcaption');cap.textContent=id+' '+v+'/'+R.n;f.append(im,cap);document.getElementById('out').append(f)}}
window.__done={errors,used:KITBAU.used.size}})();
</script></body></html>
