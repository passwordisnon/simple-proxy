<!doctype html><html><head><meta charset="utf8"><title>fauna</title>
<style>body{margin:0;background:#f4ecff;font:12px sans-serif}#out{display:grid;grid-template-columns:repeat(7,190px);gap:6px;padding:6px}figure{margin:0;background:linear-gradient(#e8f6ff,#fff3e2);border-radius:10px;text-align:center}figure img{width:190px;height:190px;display:block}figcaption{padding:2px 0 5px;font-weight:bold;color:#3b3450}</style>
</head><body><div id="out"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/ex/RoundedBoxGeometry.js"></script>
<script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script>

<script src="../js/nature2.js"></script>
<script>const UI={objThumb(){}};function el(){return document.createElement('div')}</script>
<script src="../js/fauna.js"></script>
<script>
const qs=new URLSearchParams(location.search);const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));
const W=380;const c=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,W,false);r.outputEncoding=THREE.sRGBEncoding;
const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,1,.01,100);const M=makeMats({skin:'haut',color:0});
const keys=qs.get('ids')?qs.get('ids').split(','):Object.keys(FAUNA.S);const mode=qs.get('mode')||'';const tt=+(qs.get('t')||1.3);
for(const k of keys){let url='';try{QF=+(qs.get('q')||.5);const g=FAUNA.buildAnimal(FAUNA.S[k].a,M);QF=1;addOutlines(g);if(qs.get('merge'))mergeCreature(g,[]);g.userData.tick(tt,!!qs.get('move'),qs.get('fly')?1:0,mode);g.updateMatrixWorld(true);sc.add(g);
  const box=new THREE.Box3().setFromObject(g);const ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());const rad=Math.max(sz.x,sz.y,sz.z)*.62+.05;
  const dir=new THREE.Vector3(.75,.35,1).normalize();cam.position.copy(ctr).addScaledVector(dir,rad/Math.tan(15*Math.PI/180));cam.lookAt(ctr);cam.near=rad*.05;cam.far=rad*30;cam.updateProjectionMatrix();
  r.render(sc,cam);url=c.toDataURL('image/png');sc.remove(g)}catch(e){errors.push(k+': '+e.message)}
  const f=document.createElement('figure');const im=new Image();im.src=url;const cap=document.createElement('figcaption');cap.textContent=k;f.append(im,cap);document.getElementById('out').append(f)}
window.__done={errors,count:keys.length,total:keys.length};
</script></body></html>
