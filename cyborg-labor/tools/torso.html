<!doctype html><html><head><meta charset="utf8"><title>torso</title><style>body{margin:0;background:#f4ecff;font:11px sans-serif}#out{display:grid;grid-template-columns:repeat(6,220px);gap:4px;padding:4px}figure{margin:0;background:#e8f6ff;text-align:center}img{width:220px;height:260px;display:block}</style></head><body><div id="out"></div>
<script src="vendor/three.min.js"></script><script src="vendor/ex/RoundedBoxGeometry.js"></script><script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script><script src="../js/parts-kopf.js"></script><script src="../js/parts-augen.js"></script><script src="../js/parts-arme.js"></script><script src="../js/parts-beine.js"></script><script src="../js/parts-extras.js"></script><script src="../js/data.js"></script>
<script>
const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));const qs=new URLSearchParams(location.search);
const c=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(220,260,false);r.outputEncoding=THREE.sRGBEncoding;
const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,220/260,.01,100);let n=0;
const segs=(qs.get('seg')||'1,2,3').split(',').map(Number);const bare=!!qs.get('bare');const shapes=(qs.get('shapes')||TORSOS.map(t=>t.id).join(',')).split(',');
const skins=['fell','plastik','pluesch','chrom','schuppen','latex'];let k=0;
for(const shape of shapes)for(const seg of segs){try{const D=DEFAULT();const d=sanitize(Object.assign(D,{body:Object.assign(D.body,{shape,seg,skin:qs.get('skin')||skins[k%skins.length],color:(k*5)%20,pattern:k%3?'bauch':'keine'}),parts:qs.get('parts')?(()=>{const q=qs.get('parts').split(',');const pp=PARTS;return{kopf:pp.kopf[(k*7+3)%pp.kopf.length].id,augen:pp.augen[(k*5)%pp.augen.length].id,arme:pp.arme[(k*3+1)%pp.arme.length].id,beine:pp.beine[(k*11)%pp.beine.length].id,extras:[pp.extras[(k*13)%pp.extras.length].id]}})():bare?{kopf:D.parts.kopf,augen:'zwei',arme:'',beine:'',extras:[]}:Object.assign(D.parts,{extras:[]})}));if(qs.get('tint')){const T=qs.get('tint').split(',').map(Number);d.tint={kopf:T[k%T.length],augen:T[(k+1)%T.length],arme:T[(k+2)%T.length],beine:T[(k+3)%T.length],extras:T[(k+4)%T.length]}}k++;
  const g=buildCreature(d,{merge:true});sc.add(g);g.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(g);const h=box.max.y;const ang=qs.get('side')?1.2:.45;
  cam.position.set(Math.sin(ang)*h*2.1,h*.62,Math.cos(ang)*h*2.1);cam.lookAt(0,h*.5,0);r.render(sc,cam);const f=document.createElement('figure');const im=new Image();im.src=c.toDataURL();f.append(im,document.createTextNode(shape+' x'+seg));document.getElementById('out').append(f);n++;sc.remove(g)}catch(e){errors.push(shape+seg+': '+e.message+' '+(e.stack||'').split('\n')[1])}}
window.__done={errors,count:n,total:n};
</script></body></html>
