<!doctype html><html><head><meta charset="utf8"><title>harness</title>
<style>body{margin:0;background:#f4ecff;font:12px sans-serif}#out{display:grid;grid-template-columns:repeat(var(--cols),var(--px));gap:6px;padding:6px}figure{margin:0;background:linear-gradient(#e8f6ff,#fff3e2);border-radius:10px;text-align:center}figure img{width:var(--px);height:var(--px);display:block}figcaption{padding:2px 0 5px;font-weight:bold;color:#3b3450}</style>
</head><body><div id="out"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/ex/RoundedBoxGeometry.js"></script>
<script src="vendor/ex/BufferGeometryUtils.js"></script>
<script src="../js/core.js"></script>
<script src="../js/parts-kopf.js"></script>
<script src="../js/parts-augen.js"></script>
<script src="../js/parts-arme.js"></script>
<script src="../js/parts-beine.js"></script>
<script src="../js/parts-extras.js"></script>
<script>
/* Aufruf: harness.html?slot=kopf[&ids=a,b][&mode=part|full][&from=0&n=60]
   mode=part: nur das Teil (wie Labor-Vorschaubild), andere Teile als Geist.
   mode=full: ganze Kreatur mit Standard-Körper + diesem Teil.
   mode=body: mehrere Zufalls-/Beispielkörper. */
const qs=new URLSearchParams(location.search);const slot=qs.get('slot')||'kopf',mode=qs.get('mode')||'part';
const errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));const _w=console.warn;console.warn=(...a)=>{errors.push(a.map(String).join(' '));_w(...a)};
const W=+(qs.get('px')||440);const c=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(W,W,false);r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.NoToneMapping;
const sc=new THREE.Scene();cozyLights(sc);const cam=new THREE.PerspectiveCamera(30,1,.01,100);
const base=()=>({body:{seg:2,size:1,skin:qs.get('skin')||'haut',color:+(qs.get('color')||0),shape:qs.get('shape')||'ei',pattern:'keine'},parts:{kopf:'mensch',augen:'zwei',arme:'mensch',beine:'mensch',extras:[]}});
let ids=qs.get('ids')?qs.get('ids').split(','):PARTS[slot].map(p=>p.id);const from=+(qs.get('from')||0),nn=+(qs.get('n')||999);ids=ids.slice(from,from+nn);
document.documentElement.style.setProperty('--cols',qs.get('cols')||'6');document.documentElement.style.setProperty('--px',(qs.get('show')||220)+'px');
const out=document.getElementById('out');
for(const id of ids){const d=base();if(slot==='extras')d.parts.extras=[id];else d.parts[slot]=id;
  if(qs.get('with')){for(const kv of qs.get('with').split(';')){const[k,v]=kv.split('=');if(k==='extras')d.parts.extras=v.split('+');else d.parts[k]=v}}
  let url='';try{const g=buildCreature(d,{q:1,only:mode==='part'?slot:null,noShadow:true,blob:mode!=='part'});g.userData.tick(1.3,false,0);g.updateMatrixWorld(true);sc.add(g);if(qs.get('debug')){let h=0,m=0;g.traverse(o=>{if(o.userData.hull)h++;else if(o.isMesh)m++});errors.push('hulls '+h+' meshes '+m)}
    const box=new THREE.Box3().setFromObject(mode==='part'?g.userData.focus:g);if(box.isEmpty())box.setFromObject(g);const ctr=box.getCenter(new V3()),sz=box.getSize(new V3());const rad=Math.max(sz.x,sz.y,sz.z)*.62+.05;
    const dir=new V3(.55,.3,1).normalize();cam.position.copy(ctr).addScaledVector(dir,rad/Math.tan(15*PI/180));cam.lookAt(ctr);cam.near=rad*.05;cam.far=rad*30;cam.updateProjectionMatrix();
    r.render(sc,cam);url=c.toDataURL('image/png');sc.remove(g);disposeTree(g)}catch(e){errors.push(id+': '+e.message)}
  const f=document.createElement('figure');const im=new Image();im.src=url;const cap=document.createElement('figcaption');const p=findPart(slot,id);cap.textContent=id+(p?' · '+p.n:' (FEHLT)');f.append(im,cap);out.append(f)}
window.__done={errors,count:ids.length,total:PARTS[slot].length};
</script></body></html>
