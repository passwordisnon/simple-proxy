name: Cyborg-Labor auf GitHub Pages

# Läuft nur von Hand (Actions → "Cyborg-Labor auf GitHub Pages" → Run workflow).
# Vorher einmal: Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyborg-labor-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur das Spiel einpacken (ohne Werkzeuge und Altlasten)
        run: |
          mkdir -p _site
          cd cyborg-labor
          cp -r index.html sw.js manifest.webmanifest wired.css icons js lang assets audio ../_site/
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
